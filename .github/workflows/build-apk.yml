name: Build Robo-Tach APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android host
        run: flutter create --platforms=android --project-name=robo_tach .
      - name: Remove generated sample test
        run: rm -f test/widget_test.dart
      - name: Add Android microphone permission
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          permission = '<uses-permission android:name="android.permission.RECORD_AUDIO"/>'
          if permission not in s:
              s = s.replace(marker, marker + '\n    ' + permission)
          p.write_text(s)
          PY
      - name: Get packages
        run: flutter pub get
      - name: Analyze app source
        run: flutter analyze lib test
      - name: Run automated tests
        run: flutter test test/tutor_service_test.dart
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Robo-Tach-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
