name: Build Robo-Tach APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android host
        run: flutter create --platforms=android --project-name=robo_tach .
      - name: Get packages
        run: flutter pub get
      - name: Analyze app source
        run: flutter analyze lib
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Robo-Tach-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
